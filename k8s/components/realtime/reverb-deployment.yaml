# Realtime role: WebSockets for the live calendar, housekeeping board and notifications.
# REVERB_APP_ID, REVERB_APP_KEY and REVERB_APP_SECRET come from pms-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-reverb
  labels:
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pms
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pms
        app.kubernetes.io/component: realtime
    spec:
      serviceAccountName: pms
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pms
              app.kubernetes.io/component: realtime
      containers:
        - name: reverb
          image: pms
          args: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
          ports:
            - name: ws
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pms-config
            - secretRef:
                name: pms-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket: { port: ws }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket: { port: ws }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: storage, mountPath: /var/www/html/storage }
            - { name: bootstrap-cache, mountPath: /var/www/html/bootstrap/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
        - { name: storage, emptyDir: { sizeLimit: 128Mi } }
        - { name: bootstrap-cache, emptyDir: { sizeLimit: 16Mi } }
