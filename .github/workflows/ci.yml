# Pull request checks (spec §15.2): Pint, Larastan, the test suite against MySQL and Redis
# (including architecture tests and the generated-types drift check), Angular lint, unit
# tests and build, and dependency audits.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.3, MySQL 8.4, Redis 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pms_testing
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pms_testing
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan, level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Tests, architecture rules and BFF types drift check
        run: php artisan test

      - name: Audit trail integrity command
        run: php artisan migrate --force && php artisan audit:verify

      - name: Dependency audit (Composer)
        run: composer audit

  frontend:
    name: Frontend (Angular 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/angular

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: resources/angular/package-lock.json

      # Same npm as package.json "packageManager" and the image build.
      - name: Install dependencies
        run: npm install -g npm@11.6.1 && npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Karma, headless Chrome)
        run: npm run test:ci

      - name: Production build
        run: npm run build -- --configuration=production

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0

    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every overlay
        run: |
          set -euo pipefail
          for overlay in k8s/overlays/*/ k8s/overlays/*/release/; do
            echo "::group::${overlay}"
            kubectl kustomize "${overlay}" > rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
            # Deployed images carry an immutable tag, never "latest" (DEP-10).
            if grep -E '^\s*image:' rendered.yaml | grep -vE 'image: \S+:[A-Za-z0-9._-]+$' | grep -q . \
              || grep -qE 'image: \S+:latest$' rendered.yaml; then
              echo "::error::${overlay} deploys an untagged or :latest image"; exit 1
            fi
            echo "::endgroup::"
          done

  image:
    name: Container image (build, scan, smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Tagged with the commit SHA (DEP-10). Pushing to the registry is a deployment step.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pms:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (DEP-14)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pms:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test (non-root, read-only root filesystem)
        run: |
          set -euo pipefail
          docker run -d --name pms -p 8080:8080 --read-only \
            --tmpfs /tmp --tmpfs /var/www/html/storage:uid=82,gid=82 --tmpfs /var/www/html/bootstrap/cache:uid=82,gid=82 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e SESSION_DRIVER=array -e CACHE_STORE=array \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/smoke.sqlite \
            pms:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080/up > /dev/null && break; sleep 1; done
          test "$(docker exec pms id -u)" = "82"
          curl -fsS -o /dev/null -w 'up %{http_code}\n' http://localhost:8080/up
          curl -fsS -D - -o /dev/null http://localhost:8080/settings/rooms | grep -qi 'cache-control: no-cache'
          curl -fsS -D - -o /dev/null http://localhost:8080/up | grep -qi "x-app-version: ${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/bff/session)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/chunk-MISSING00.js)" = "404"

      - name: Container logs
        if: always()
        run: docker logs pms || true
