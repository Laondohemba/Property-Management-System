; PHP-FPM pool for the web role. Loaded after the image's www.conf and docker.conf, so these
; values win. The master runs as www-data (non-root), so no user/group switching happens.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
; Finish in-flight requests on SIGQUIT before exiting (graceful drain, spec §3.3).
process_control_timeout = 30s

[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Sized for the web pod's 1 GiB memory limit (about 40 MB per worker plus Nginx and OPcache).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

request_terminate_timeout = 60s
; Access logs come from Nginx; FPM's own access log would duplicate every line.
access.log = /dev/null
