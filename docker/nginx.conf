# Web role: Nginx serves the compiled Angular bundle from public/ and hands the BFF,
# integration surface and health route to PHP-FPM (spec §3.1, §11.2).
# Runs as www-data on an unprivileged port (DEP-14); every writable path lives under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Structured JSON access logs on stdout for the cluster logging agent (spec §3.5).
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_duration":"$upstream_response_time","user_agent":"$http_user_agent"}';

    # The kubelet probes /up every few seconds; keep them out of the access log.
    map $request_uri $loggable {
        ~^/up(\?|$) 0;
        default 1;
    }
    access_log /dev/stdout json if=$loggable;

    # Deep links: GET/HEAD fall back to the SPA shell, every other method goes to Laravel
    # (Fortify's POST /login, /logout, /two-factor-challenge and friends).
    map $request_method $spa_fallback {
        GET /index.html;
        HEAD /index.html;
        default /index.php$is_args$args;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 24m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # TLS terminates at the ingress. Forwarded headers are interpreted by Laravel's trusted
    # proxies (bootstrap/app.php), so REMOTE_ADDR stays the ingress address here.

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Laravel surfaces: never answered by the SPA fallback (spec §11.2). /user/* holds
        # Fortify's two-factor JSON endpoints; /horizon is the queue dashboard (Super Admin);
        # /storage serves signed media URLs when MEDIA_DISK is the local disk (S3 needs none).
        location ~ ^/(bff|integrations|webhooks|broadcasting|sanctum|up|user|horizon|storage)(/|$) {
            rewrite ^ /index.php last;
        }

        # Content-hashed bundles (main-<hash>.js, chunk-<hash>.js, styles-<hash>.css, media/):
        # cache for a year. A missing chunk is a real 404 so the ingress retries another pod
        # and the SPA can reload (spec §4.4) instead of receiving index.html as JavaScript.
        # Quoted because the {8,} quantifier would otherwise open an Nginx block.
        location ~* "^/(?:[^/]+-[A-Z0-9]{8,}\.(?:js|css|mjs)|media/.+)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # The shell must never be cached, so a new release is picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /favicon.svg { access_log off; }
        location = /robots.txt  { access_log off; }

        # Static files first, then the SPA shell (GET) or Laravel (other methods).
        location / {
            try_files $uri $spa_fallback;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_PROXY "";
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 60s;
        }

        # No other PHP file is reachable, and dotfiles are never served.
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known) { deny all; }
    }
}
