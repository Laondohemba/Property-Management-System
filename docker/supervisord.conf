; Web role process manager (spec §3.1): Nginx + PHP-FPM in one container, run as www-data.
; Worker, scheduler and release pods override the container command and never start this.

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
childlogdir = /tmp

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize --force-stderr
priority = 10
autorestart = true
startsecs = 2
; SIGQUIT lets FPM finish in-flight requests (process_control_timeout).
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
; -e: log start-up errors to stderr instead of the compiled-in path (read-only filesystem).
command = /usr/sbin/nginx -e /dev/stderr -g "daemon off;"
priority = 20
autorestart = true
startsecs = 2
; SIGQUIT is Nginx's graceful shutdown: stop accepting, finish open requests.
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; If either program dies for good, stop the container so Kubernetes restarts the pod
; rather than leaving a half-working web pod in rotation.
[eventlistener:fatal-exit]
command = sh -c 'printf "READY\n"; while read -r line; do kill -TERM 1; done'
; stdout is the event protocol channel, so only stderr is logged.
events = PROCESS_STATE_FATAL
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
